# Hypatia template. `hypatia init --with mirror` fills in:
#   {{DEFAULT_BRANCH}}  the branch the wiki is mirrored from (main, master, ...)
#   {{WIKI_DIR}}        the folder of wiki pages (docs/wiki)
#   {{HYPATIA}}         how to run Hypatia in this repo (e.g. npx hypatia)
#
# Copies the wiki into the repo's GitHub Wiki tab after every merge. The repo
# stays the source of truth; the Wiki tab is a read-only copy, and each page
# ends with "Edit this page in the repo: <link>". Private pages are never
# copied, and nothing is copied while the privacy guard finds something.
#
# One-time setup, by a repo admin:
#   1. Settings > General > Features: tick "Wikis".
#   2. Open the Wiki tab and create any first page by hand (GitHub creates
#      the <repo>.wiki.git repository only once a page exists).
# After that this job replaces every page on each run. It mirrors only the
# default branch: a manual run started on another branch is skipped.
#
# GitHub expressions reach the shell only through env, never inside run:.
name: Wiki mirror

on:
  push:
    branches: [{{DEFAULT_BRANCH}}]
    paths:
      - README.md
      - {{WIKI_DIR}}/**
      - .github/workflows/wiki-mirror.yml
  workflow_dispatch:

permissions:
  contents: write  # lets the built-in token push to <repo>.wiki.git

concurrency:
  group: wiki-mirror
  cancel-in-progress: false

jobs:
  mirror:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Clone the Wiki tab
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki-out
      - name: Write the pages
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: {{HYPATIA}} mirror --out wiki-out --branch "$BRANCH"
      - name: Push to the Wiki tab
        working-directory: wiki-out
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The Wiki tab is already up to date."
            exit 0
          fi
          git commit -m "Mirror the wiki from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
          git push
