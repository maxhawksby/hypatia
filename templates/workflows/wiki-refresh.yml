# Hypatia template. `hypatia init` fills in:
#   {{DEFAULT_BRANCH}}  the branch the site is built from (main, master, ...)
#
# Keep the wiki's "working on now" current when someone pushes to their own
# branch. Pages only deploys from {{DEFAULT_BRANCH}}, so this just asks the
# Wiki site workflow to rebuild from it with fresh GitHub data.
name: Wiki refresh

on:
  push:
    branches-ignore: [{{DEFAULT_BRANCH}}]

permissions:
  actions: write

concurrency:
  group: wiki-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild the wiki site from {{DEFAULT_BRANCH}}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Before the wiki lands on the default branch there is nothing to rebuild yet.
          if ! gh workflow view wiki-site.yml --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "The wiki site workflow isn't on {{DEFAULT_BRANCH}} yet; nothing to refresh."
            exit 0
          fi
          gh workflow run wiki-site.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}"
